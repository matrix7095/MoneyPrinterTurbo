[project]
name = "glance-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "platformdirs>=4,<5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "rich>=13,<15",
  "typer>=0.15,<1",
]

[project.scripts]
glance-agent = "glance_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "src/glance_agent",
  "skill/glance-ops-doctor",
  "skill/glance-discovery-agent",
  "skill/glance-assistant-agent",
  "skill/_shared",
  "skill/glance-research-agent",
  "skill/glance-script-agent",
  "skill/glance-visual-agent",
  "skill/glance-image-agent",
  "skill/glance-video-agent",
  "skill/glance-publish-agent",
  "skill/glance-scheduler-agent",
]

[tool.hatch.build.targets.wheel.force-include]
"skill/glance-ops-doctor" = "glance_agent/skill/glance-ops-doctor"
"skill/glance-discovery-agent" = "glance_agent/skill/glance-discovery-agent"
"skill/glance-assistant-agent" = "glance_agent/skill/glance-assistant-agent"
"skill/_shared" = "glance_agent/skill/_shared"
"skill/glance-research-agent" = "glance_agent/skill/glance-research-agent"
"skill/glance-script-agent" = "glance_agent/skill/glance-script-agent"
"skill/glance-visual-agent" = "glance_agent/skill/glance-visual-agent"
"skill/glance-image-agent" = "glance_agent/skill/glance-image-agent"
"skill/glance-video-agent" = "glance_agent/skill/glance-video-agent"
"skill/glance-publish-agent" = "glance_agent/skill/glance-publish-agent"
"skill/glance-scheduler-agent" = "glance_agent/skill/glance-scheduler-agent"
