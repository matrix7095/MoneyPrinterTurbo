interface:
  display_name: "Glance 排障 Agent"
  short_description: "每天读取本机结构化日志；低风险修复自动验证发布，高风险修复等待人工把关"
  default_prompt: "Use $glance-ops-doctor to inspect Glance diagnostics. Classify every proposed repair as LOW_AUTO_RELEASE or HUMAN_REVIEW. For LOW_AUTO_RELEASE, repair only in a dedicated worktree, run all quality gates and the fixed 8010 pre-production checks, then fast-forward main, restart main with restart.ps1 -SkipPull, verify /healthz, push origin/main, and report the evidence without waiting for confirmation. For HUMAN_REVIEW, first report the root cause and repair plan, wait for explicit confirmation, then repair in a dedicated worktree, run the gates, report the evidence, wait for separate release confirmation, and only then merge, restart, verify, and push. Never publish content or access publishing credentials."
